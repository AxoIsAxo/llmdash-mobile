name: Build Mobile APK

on:
  # Nightly build — runs at 04:00 UTC every day on the default branch (mobile).
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'LLMDash server URL to bake into the APK (e.g. https://ai.redforged.eu/). Leave empty to use the LLMDASH_SERVER_URL repository secret.'
        required: false
        type: string

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: '35'
          build-tools-version: '35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Scheduled runs can't prompt for a URL: use the manually entered input
      # when dispatching, otherwise fall back to the LLMDASH_SERVER_URL secret.
      - name: Resolve server URL
        id: url
        run: |
          URL="${{ inputs.url || secrets.LLMDASH_SERVER_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::No LLMDash server URL. Set the LLMDASH_SERVER_URL repository secret (Settings → Secrets and variables → Actions) so nightly builds can run, or run this workflow manually and enter a URL."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Write build-time .env
        working-directory: frontend
        run: |
          cd ..
          echo "LLMDASH_SERVER_URL=${{ steps.url.outputs.url }}" > .env
          cat .env

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build debug APK
        working-directory: frontend
        run: npm run mobile:build:debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: llmdash-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
